name: Deploy Backend

# Backend only. This repository also holds the Flutter app; nothing here builds,
# tests or ships it.
on:
  push:
    branches: [main]
    paths:
      # Restricted to the backend so a Flutter-only commit does not restart
      # production for no reason.
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

# One deployment at a time against the production directory.
# Do not cancel a deployment midway because EC2 could be left between
# git reset and PM2 restart.
concurrency:
  group: production-backend
  cancel-in-progress: false

# The job only needs to read repo metadata; it never pushes.
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    # Only main can deploy to production.
    if: github.ref == 'refs/heads/main'

    steps:

      # ============================================================
      # SSH CONFIGURATION
      # ============================================================
      #
      # No actions/checkout is required.
      # EC2 pulls the repository directly from GitHub.
      #
      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}

        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Write private deployment key securely.
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          PORT="${EC2_PORT:-22}"

          if [ -n "${EC2_KNOWN_HOSTS:-}" ]; then
            # Preferred: pinned EC2 host key.
            printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            # Fallback if EC2_KNOWN_HOSTS has not been configured yet.
            echo "::warning::EC2_KNOWN_HOSTS is not set; falling back to ssh-keyscan (host key unverified)."

            ssh-keyscan -p "$PORT" -H "$EC2_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi

          chmod 600 ~/.ssh/known_hosts


      # ============================================================
      # DEPLOY BACKEND
      # ============================================================
      -
        name: Deploy backend and restart PM2

        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PORT: ${{ secrets.EC2_PORT }}

          # Repository variable.
          # Defaults to 5000 if not configured.
          BACKEND_PORT: ${{ vars.BACKEND_PORT }}

          # Exact commit that triggered this workflow.
          GITHUB_SHA: ${{ github.sha }}

        run: |
          set -euo pipefail

          ssh -i ~/.ssh/deploy_key \
              -p "${EC2_PORT:-22}" \
              -o BatchMode=yes \
              -o ConnectTimeout=20 \
              "$EC2_USER@$EC2_HOST" \
              "BACKEND_PORT='${BACKEND_PORT:-5000}' EXPECTED_SHA='${GITHUB_SHA}' bash -s" <<'REMOTE'

          set -euo pipefail


          # ========================================================
          # PATHS / PROCESS
          # ========================================================

          APP_DIR="$HOME/Lawyer-App"
          BACKEND_DIR="$APP_DIR/backend"
          PM2_NAME="lawyer-backend"


          # ========================================================
          # ENVIRONMENT
          # ========================================================

          echo "::group::Environment"

          echo "Initial node: $(node --version 2>/dev/null || echo 'not found')"
          echo "Initial npm:  $(npm --version 2>/dev/null || echo 'not found')"
          echo "pm2:          $(pm2 --version 2>/dev/null || echo 'not found')"
          echo "dir:          $APP_DIR"

          echo "::endgroup::"


          # ========================================================
          # WORKING TREE BEFORE DEPLOY
          # ========================================================

          cd "$APP_DIR"

          echo "::group::Working tree before deploy"

          if [ -n "$(git status --porcelain)" ]; then
            echo "Local modifications on EC2:"
            git status --porcelain

            echo ""
            echo "Tracked modifications will be replaced by origin/main."
            echo "Ignored/untracked production files such as backend/.env"
            echo "and backend/uploads/ are NOT removed."
          else
            echo "working tree clean"
          fi

          echo "Currently deployed: $(git rev-parse --short HEAD)"

          echo "::endgroup::"


          # ========================================================
          # FETCH + RESET
          # ========================================================

          echo "::group::Fetch and reset to origin/main"

          git fetch origin main

          # Deterministic deployment.
          # This makes EC2 exactly match origin/main.
          #
          # IMPORTANT:
          # git clean is intentionally NOT used.
          #
          # This preserves:
          #   backend/.env
          #   backend/uploads/
          #
          # because those are production files and are not tracked.
          git reset --hard origin/main

          echo "Now deployed: $(git rev-parse --short HEAD)"

          echo "::endgroup::"


          # ========================================================
          # VERIFY COMMIT
          # ========================================================

          echo "::group::Prove the checkout matches the commit being deployed"

          ACTUAL_SHA="$(git rev-parse HEAD)"

          echo "expected commit: ${EXPECTED_SHA:-<not provided>}"
          echo "actual commit:   $ACTUAL_SHA"

          if [ -n "${EXPECTED_SHA:-}" ] && [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "ERROR: EC2 checkout does not match GitHub commit."

            echo ""
            echo "Git remote:"
            git remote -v

            exit 1
          fi


          # Make absolutely sure dependency manifests match HEAD.
          if ! git diff --exit-code HEAD -- \
              backend/package.json \
              backend/package-lock.json; then

            echo "ERROR: backend dependency files differ from the commit."

            exit 1
          fi


          echo ""
          echo "Working tree:"
          git status --short || true


          echo ""
          echo "Dependency manifest checksums:"
          sha256sum \
            backend/package.json \
            backend/package-lock.json


          echo "::endgroup::"


          # ========================================================
          # NPM MANIFEST INTERFERENCE CHECK
          # ========================================================

          echo "::group::npm manifest interference check"


          # npm-shrinkwrap.json takes precedence over package-lock.json.
          #
          # If an old untracked shrinkwrap file exists on EC2,
          # npm ci can resolve a completely different dependency tree.
          SHRINKWRAP="$BACKEND_DIR/npm-shrinkwrap.json"

          if [ -f "$SHRINKWRAP" ]; then

            echo "ERROR: $SHRINKWRAP exists."

            echo ""
            echo "This file overrides package-lock.json."
            echo "It is untracked, so git reset --hard does not remove it."

            echo ""
            echo "Remove it once on EC2:"
            echo "  rm '$SHRINKWRAP'"

            exit 1
          fi

          echo "npm-shrinkwrap.json: absent (good)"


          # Check npmrc files without printing credentials/tokens.
          for RC in \
            "$BACKEND_DIR/.npmrc" \
            "$APP_DIR/.npmrc" \
            "$HOME/.npmrc"; do

            if [ -f "$RC" ]; then

              echo "note: $RC present"

              echo "keys:"
              sed \
                -n \
                's/^\([A-Za-z0-9_@:/-]*\)=.*/\1/p' \
                "$RC" \
                | tr '\n' ' '

              echo ""
            fi
          done


          # Show NPM_CONFIG_* variables without exposing their values.
          NPM_ENV="$(
            env \
              | grep '^NPM_CONFIG_' \
              | sed 's/=.*/=<redacted>/' \
              || true
          )"

          if [ -n "$NPM_ENV" ]; then

            echo "NPM_CONFIG_* environment overrides are set:"
            echo "$NPM_ENV"

          else

            echo "NPM_CONFIG_* overrides: none"

          fi


          echo "::endgroup::"


          # ========================================================
          # PRODUCTION ENVIRONMENT
          # ========================================================

          cd "$BACKEND_DIR"

          echo "::group::Verify production configuration"


          if [ ! -f .env ]; then

            echo "ERROR: $BACKEND_DIR/.env is missing."

            echo "Refusing to restart backend without production configuration."

            exit 1
          fi


          # Never print .env contents.
          echo ".env present ($(wc -c < .env) bytes)"


          echo "::endgroup::"


          # ========================================================
          # SELECT NODE 22
          # ========================================================
          #
          # package.json requires Node 22.x.
          #
          # IMPORTANT:
          # Do NOT silently fall back to another Node/LTS version.
          #
          # The previous workflow used:
          #
          #   nvm use 22 || nvm use --lts || true
          #
          # That could silently run Node 24/20/etc.
          #
          # Production must use Node 22.
          #

          echo "::group::Select Node 22"


          NVM_DIR="${NVM_DIR:-$HOME/.nvm}"


          if [ -s "$NVM_DIR/nvm.sh" ]; then

            echo "Loading nvm from $NVM_DIR"

            . "$NVM_DIR/nvm.sh"

          else

            echo "ERROR: nvm is not installed on EC2."
            echo ""
            echo "Install Node 22 on EC2 first:"
            echo ""
            echo "  nvm install 22"
            echo "  nvm alias default 22"
            echo ""
            echo "Then rerun the GitHub Actions deployment."

            exit 1

          fi


          if ! command -v nvm >/dev/null 2>&1; then

            echo "ERROR: nvm command is unavailable."

            exit 1

          fi


          # Make sure Node 22 is installed.
          if ! nvm ls 22 >/dev/null 2>&1; then

            echo "ERROR: Node 22.x is not installed through nvm."

            echo ""
            echo "Install it once on EC2:"
            echo ""
            echo "  nvm install 22"
            echo "  nvm alias default 22"

            exit 1

          fi


          # Select Node 22.
          nvm use 22


          # Refresh shell command cache.
          hash -r


          NODE_VERSION="$(node --version)"
          NPM_VERSION="$(npm --version)"


          echo "Node: $NODE_VERSION"
          echo "npm:  $NPM_VERSION"

          echo "node path: $(command -v node)"
          echo "npm path:  $(command -v npm)"


          NODE_MAJOR="$(
            node --version \
              | sed 's/^v\([0-9]*\).*/\1/'
          )"


          if [ "$NODE_MAJOR" != "22" ]; then

            echo "ERROR: Expected Node 22.x."

            echo "Actual Node: $(node --version)"

            exit 1

          fi


          echo "Node 22 confirmed."


          echo "::endgroup::"


          # ========================================================
          # STANDARDIZE NPM
          # ========================================================
          #
          # Your local environment successfully completes:
          #
          #   npm ci --omit=dev
          #
          # with npm 11.13.0.
          #
          # Production will therefore use the same npm version.
          #

          echo "::group::Standardize npm"


          echo "Installing npm 11.13.0..."

          npm install --global npm@11.13.0


          # Refresh shell command cache.
          hash -r


          echo ""
          echo "Node after npm installation:"
          node --version

          echo ""
          echo "npm after npm installation:"
          npm --version

          echo ""
          echo "npm path:"
          command -v npm


          EXPECTED_NPM="11.13.0"
          ACTUAL_NPM="$(npm --version)"


          if [ "$ACTUAL_NPM" != "$EXPECTED_NPM" ]; then

            echo "ERROR: Expected npm $EXPECTED_NPM."

            echo "Actual npm: $ACTUAL_NPM"

            exit 1

          fi


          echo "npm $EXPECTED_NPM confirmed."


          echo "::endgroup::"


          # ========================================================
          # FINAL TOOLCHAIN VERIFICATION
          # ========================================================

          echo "::group::Production toolchain"


          echo "node              $(node --version)"
          echo "npm               $(npm --version)"

          echo "which node        $(command -v node)"
          echo "which npm         $(command -v npm)"

          echo "npm registry      $(npm config get registry)"
          echo "package-lock      $(npm config get package-lock)"
          echo "lockfile-version  $(npm config get lockfile-version)"
          echo "install-strategy  $(npm config get install-strategy)"
          echo "legacy-peer-deps  $(npm config get legacy-peer-deps)"


          NODE_MAJOR="$(
            node --version \
              | sed 's/^v\([0-9]*\).*/\1/'
          )"

          NPM_VERSION="$(npm --version)"


          if [ "$NODE_MAJOR" != "22" ]; then

            echo "ERROR: Node 22.x is required."

            exit 1

          fi


          if [ "$NPM_VERSION" != "11.13.0" ]; then

            echo "ERROR: npm 11.13.0 is required."

            exit 1

          fi


          echo ""
          echo "Production toolchain verified:"
          echo "  Node  = $(node --version)"
          echo "  npm   = $(npm --version)"


          echo "::endgroup::"


          # ========================================================
          # INSTALL PRODUCTION DEPENDENCIES
          # ========================================================

          echo "::group::Install dependencies"


          # IMPORTANT:
          #
          # npm ci:
          #   - uses package-lock.json
          #   - does not rewrite package-lock.json
          #   - fails if package.json and package-lock.json disagree
          #
          # --omit=dev:
          #   - does not install development dependencies
          #   - keeps Jest/nodemon/supertest/etc. off production
          #
          echo "Running:"
          echo "  npm ci --omit=dev"

          npm ci --omit=dev


          echo "Production dependencies installed successfully."


          echo "::endgroup::"


          # ========================================================
          # RESTART PM2
          # ========================================================

          echo "::group::Restart PM2"


          echo "Restarting: $PM2_NAME"

          pm2 restart "$PM2_NAME" --update-env


          # Persist PM2 process list.
          pm2 save || true


          echo "::endgroup::"


          # ========================================================
          # VERIFY PM2 PROCESS
          # ========================================================

          echo "::group::Verify process is online"


          # Give the application time to boot.
          sleep 5


          STATUS="$(
            pm2 jlist \
              | PM2_NAME="$PM2_NAME" node -e '

                let raw = "";

                process.stdin.on("data", (c) => {
                  raw += c;
                });

                process.stdin.on("end", () => {

                  try {

                    const list = JSON.parse(
                      raw.slice(raw.indexOf("["))
                    );

                    const proc = list.find(
                      (p) => p.name === process.env.PM2_NAME
                    );

                    console.log(
                      proc
                        ? proc.pm2_env.status
                        : "missing"
                    );

                  } catch (e) {

                    console.log("unreadable");

                  }

                });

              '
          )"


          echo "pm2 status: $STATUS"

          pm2 status


          if [ "$STATUS" != "online" ]; then

            echo ""
            echo "ERROR: $PM2_NAME is '$STATUS', not online."

            echo ""
            echo "Last PM2 logs:"

            pm2 logs "$PM2_NAME" \
              --lines 30 \
              --nostream \
              || true

            exit 1

          fi


          # Check again to catch immediate crash loops.
          sleep 5


          STATUS_AGAIN="$(
            pm2 jlist \
              | PM2_NAME="$PM2_NAME" node -e '

                let raw = "";

                process.stdin.on("data", (c) => {
                  raw += c;
                });

                process.stdin.on("end", () => {

                  try {

                    const list = JSON.parse(
                      raw.slice(raw.indexOf("["))
                    );

                    const proc = list.find(
                      (p) => p.name === process.env.PM2_NAME
                    );

                    console.log(
                      proc
                        ? proc.pm2_env.status
                        : "missing"
                    );

                  } catch (e) {

                    console.log("unreadable");

                  }

                });

              '
          )"


          echo "pm2 status after stability check: $STATUS_AGAIN"


          if [ "$STATUS_AGAIN" != "online" ]; then

            echo ""
            echo "ERROR: $PM2_NAME did not stay online."

            echo "Current status: $STATUS_AGAIN"

            echo ""
            echo "Last PM2 logs:"

            pm2 logs "$PM2_NAME" \
              --lines 30 \
              --nostream \
              || true

            exit 1

          fi


          echo "PM2 process is online and stable."


          echo "::endgroup::"


          # ========================================================
          # HEALTH CHECK
          # ========================================================

          echo "::group::Health check"


          # Existing backend endpoint:
          #
          # GET /api
          #
          # Expected:
          # HTTP 200
          #

          PORT="${BACKEND_PORT:-5000}"

          echo "Health check port: $PORT"


          OK=0


          for attempt in 1 2 3 4 5 6; do

            CODE="$(
              curl \
                -s \
                -o /dev/null \
                -w '%{http_code}' \
                --max-time 10 \
                "http://127.0.0.1:${PORT}/api" \
                || echo 000
            )"


            echo "attempt ${attempt}: HTTP ${CODE}"


            if [ "$CODE" = "200" ]; then

              OK=1

              break

            fi


            sleep 5

          done


          if [ "$OK" != "1" ]; then

            echo ""
            echo "ERROR: health endpoint did not return HTTP 200."

            echo "Checked:"
            echo "  http://127.0.0.1:${PORT}/api"

            echo ""
            echo "If the backend listens on another port,"
            echo "set the GitHub repository variable:"
            echo "  BACKEND_PORT"


            echo ""
            echo "Last PM2 logs:"

            pm2 logs "$PM2_NAME" \
              --lines 30 \
              --nostream \
              || true

            exit 1

          fi


          echo "Health check passed."


          echo "::endgroup::"


          # ========================================================
          # SUCCESS
          # ========================================================

          echo ""
          echo "=============================================="
          echo "       BACKEND DEPLOYMENT SUCCESSFUL"
          echo "=============================================="

          echo "Commit: $(git -C "$APP_DIR" rev-parse --short HEAD)"
          echo "Node:   $(node --version)"
          echo "npm:    $(npm --version)"
          echo "PM2:    $PM2_NAME"
          echo "Port:   $PORT"
          echo ""
          echo "Backend is online and responding."
          echo "=============================================="


          REMOTE


      # ============================================================
      # REMOVE SSH KEY
      # ============================================================

      - name: Remove deploy key

        if: always()

        run: |
          rm -f ~/.ssh/deploy_key