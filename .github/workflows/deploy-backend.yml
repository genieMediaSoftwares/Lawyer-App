name: Deploy Backend

# Backend only. This repository also holds the Flutter app; nothing here builds,
# tests or ships it.
on:
  push:
    branches: [main]
    paths:
      # Restricted to the backend so a Flutter-only commit does not restart
      # production for no reason. Delete this `paths:` block if you would rather
      # every push to main deploy.
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

# One deployment at a time against the production directory. `cancel-in-progress`
# is deliberately false: cancelling a run midway could leave EC2 between
# `git reset` and `pm2 restart` — code updated, process still on the old build.
# A second push queues behind the first instead.
concurrency:
  group: production-backend
  cancel-in-progress: false

# The job only needs to read the repo metadata; it never pushes.
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    # Belt and braces alongside the branch filter above, so a fork or a manual
    # run from another ref cannot touch production.
    if: github.ref == 'refs/heads/main'

    steps:
      # The runner installs nothing — EC2 pulls from GitHub and runs npm there,
      # so this is only so any node/npm invoked on the runner matches the
      # project's engines field rather than whatever the image ships.
      - name: Use Node 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      # No actions/checkout: EC2 pulls from GitHub itself, so the runner never
      # needs the source. Nothing is copied from runner to server.
      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Written straight from the secret to a 600 file. It is never echoed,
          # never interpolated into a command line, and the runner is destroyed
          # after the job.
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          PORT="${EC2_PORT:-22}"

          if [ -n "${EC2_KNOWN_HOSTS:-}" ]; then
            # Pinned host key: the server's identity is verified against a value
            # you captured yourself, so a redirected connection is refused.
            printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            # Trust-on-first-use. Works, but the first handshake is unverified —
            # set the EC2_KNOWN_HOSTS secret to close that gap. See the runbook.
            echo "::warning::EC2_KNOWN_HOSTS is not set; falling back to ssh-keyscan (host key unverified)."
            ssh-keyscan -p "$PORT" -H "$EC2_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi

          chmod 600 ~/.ssh/known_hosts

      - name: Deploy backend and restart PM2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
          # Not a secret — the port the app listens on, used only for the local
          # health probe. Set the repository variable to override the default.
          BACKEND_PORT: ${{ vars.BACKEND_PORT }}
          # The commit this run is deploying. The server proves it is on exactly
          # this tree before installing anything.
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/deploy_key \
              -p "${EC2_PORT:-22}" \
              -o BatchMode=yes \
              -o ConnectTimeout=20 \
              "$EC2_USER@$EC2_HOST" \
              "BACKEND_PORT='${BACKEND_PORT:-5000}' EXPECTED_SHA='${GITHUB_SHA}' bash -s" <<'REMOTE'
          set -euo pipefail

          APP_DIR="$HOME/Lawyer-App"
          BACKEND_DIR="$APP_DIR/backend"
          PM2_NAME="lawyer-backend"

          echo "::group::Environment"
          echo "node    $(node --version)"
          echo "npm     $(npm --version)"
          echo "pm2     $(pm2 --version 2>/dev/null || echo 'not found')"
          echo "dir     $APP_DIR"
          echo "::endgroup::"

          cd "$APP_DIR"

          echo "::group::Working tree before deploy"
          # Recorded, not silently discarded. Tracked files modified on the
          # server are about to be overwritten by origin/main — most often
          # backend/package-lock.json, rewritten by an `npm install` run by hand.
          # If anything here matters, stop the workflow and rescue it.
          if [ -n "$(git status --porcelain)" ]; then
            echo "Local modifications that the reset below will discard:"
            git status --porcelain
          else
            echo "working tree clean"
          fi
          echo "Currently deployed: $(git rev-parse --short HEAD)"
          echo "::endgroup::"

          echo "::group::Fetch and reset to origin/main"
          git fetch origin main
          # Deterministic: the server matches origin/main exactly, whatever state
          # it was left in.
          #
          # `git clean` is deliberately NOT run here. reset --hard only touches
          # TRACKED files, so backend/.env and backend/uploads/ — both untracked
          # and gitignored — are left alone. `git clean -fd` would delete every
          # uploaded document and the production .env.
          git reset --hard origin/main
          echo "Now deployed:      $(git rev-parse --short HEAD)"
          echo "::endgroup::"

          echo "::group::Prove the checkout matches the commit being deployed"
          # `npm ci` failed here with "Missing: gcp-metadata@5.3.0 ..." while the
          # SAME commit installed cleanly on a developer machine. Those versions
          # belong to google-auth-library v8, which the committed lockfile does
          # not contain — it resolves googleapis 173 to google-auth-library 10.
          # So npm was reading a manifest that is not the committed one, and the
          # checks below say which.
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "expected commit: ${EXPECTED_SHA:-<not provided>}"
          echo "actual commit:   $ACTUAL_SHA"

          if [ -n "${EXPECTED_SHA:-}" ] && [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "ERROR: the checkout is not the commit being deployed."
            echo "  Check that this clone's origin is genieMediaSoftwares/Lawyer-App:"
            git remote -v
            exit 1
          fi

          # Tracked files must match HEAD exactly. A modified package.json or
          # lockfile here is the whole problem, and reset --hard should have
          # already removed it — if this fires, something rewrites them after.
          if ! git diff --exit-code HEAD -- backend/package.json backend/package-lock.json; then
            echo "ERROR: backend dependency files differ from the commit."
            exit 1
          fi

          echo "working tree:"
          git status --short || true

          echo "checksums (must match the committed files):"
          sha256sum backend/package.json backend/package-lock.json
          echo "::endgroup::"

          echo "::group::npm manifest interference check"
          # Files that override the committed lockfile AND survive
          # `git reset --hard`, because reset only touches TRACKED files.
          #
          # npm-shrinkwrap.json is the dangerous one: npm gives it precedence
          # over package-lock.json, so a leftover from an older dependency tree
          # silently replaces the lockfile this repo ships — which produces
          # exactly the "Missing: <old versions> from lock file" failure seen
          # here, on a checkout that is otherwise byte-identical to the commit.
          SHRINKWRAP="$BACKEND_DIR/npm-shrinkwrap.json"
          if [ -f "$SHRINKWRAP" ]; then
            echo "ERROR: $SHRINKWRAP exists and overrides the committed package-lock.json."
            echo "  It is untracked, so 'git reset --hard' does not remove it."
            echo "  It is not part of this repository — remove it once and redeploy:"
            echo "      rm '$SHRINKWRAP'"
            exit 1
          fi
          echo "npm-shrinkwrap.json: absent (good)"

          for RC in "$BACKEND_DIR/.npmrc" "$APP_DIR/.npmrc" "$HOME/.npmrc"; do
            if [ -f "$RC" ]; then
              # Registry/auth lines can carry tokens, so only the keys are shown.
              echo "note: $RC present — keys: $(sed -n 's/^\([A-Za-z0-9_@:/-]*\)=.*/\1/p' "$RC" | tr '\n' ' ')"
            fi
          done

          NPM_ENV="$(env | grep '^NPM_CONFIG_' | sed 's/=.*/=<redacted>/' || true)"
          if [ -n "$NPM_ENV" ]; then
            echo "note: NPM_CONFIG_* environment overrides are set:"
            echo "$NPM_ENV"
          else
            echo "NPM_CONFIG_* overrides: none"
          fi
          echo "::endgroup::"

          cd "$BACKEND_DIR"

          echo "::group::Verify production configuration survived"
          if [ ! -f .env ]; then
            echo "ERROR: $BACKEND_DIR/.env is missing. Refusing to restart with no configuration."
            exit 1
          fi
          echo ".env present ($(wc -c < .env) bytes)"   # size only, never content
          echo "::endgroup::"

          echo "::group::Select Node 22"
          # THE FIX.
          #
          # `npm ci` failed here with "Missing: gcp-metadata@5.3.0 ..." on a
          # checkout byte-identical to the one that installs cleanly locally.
          # Those nine packages are exactly the dependency closure of
          # gcp-metadata@5.3.0 — and mongodb (pulled in by mongoose) declares
          #
          #     "gcp-metadata": "^5.2.0"   with peerDependenciesMeta.optional
          #
          # An OPTIONAL peer. Modern npm leaves an uninstalled optional peer out
          # of the tree, which is why it is absent from the committed lockfile
          # and why the lockfile is correct. Older npm materialises it instead,
          # then finds its closure missing from the lock and aborts. So the
          # lockfile was never the problem — the npm reading it was.
          #
          # Node 22.x ships npm 10.9.x, which gets this right, and is what
          # package.json's engines field asks for.
          if [ -s "${NVM_DIR:-$HOME/.nvm}/nvm.sh" ]; then
            # shellcheck disable=SC1091
            . "${NVM_DIR:-$HOME/.nvm}/nvm.sh"
            # `nvm use` is best-effort: a box without 22 installed keeps its
            # current version and the gate below reports it.
            nvm use 22 >/dev/null 2>&1 || nvm use --lts >/dev/null 2>&1 || true
            echo "nvm: loaded from ${NVM_DIR:-$HOME/.nvm}"
          else
            echo "nvm: not installed — using the system Node"
          fi
          echo "::endgroup::"

          echo "::group::Toolchain"
          echo "node             $(node --version)"
          echo "npm              $(npm --version)"
          echo "which node       $(command -v node)"
          echo "which npm        $(command -v npm)"
          echo "registry         $(npm config get registry)"
          echo "package-lock     $(npm config get package-lock)"
          echo "lockfile-version $(npm config get lockfile-version)"
          echo "install-strategy $(npm config get install-strategy)"
          echo "legacy-peer-deps $(npm config get legacy-peer-deps)"

          NODE_MAJOR="$(node --version | sed 's/^v\([0-9]*\).*/\1/')"
          NPM_MAJOR="$(npm --version | cut -d. -f1)"

          if [ "$NODE_MAJOR" != "22" ]; then
            echo "::warning::EC2 is on Node ${NODE_MAJOR}.x but package.json declares engines.node 22.x. Install Node 22 (nvm install 22 && nvm alias default 22) so production matches what is built and tested."
          fi

          # The hard gate is on npm, because npm is what mishandles the optional
          # peer above. npm 10 ships with Node 20.5+ and 22, and resolves it
          # correctly; anything older reproduces the failure this deploy hit.
          if [ "$NPM_MAJOR" -lt 10 ]; then
            echo "ERROR: npm $(npm --version) treats mongodb's OPTIONAL peer dependency"
            echo "  gcp-metadata as required, and then reports its dependencies as"
            echo "  missing from the lockfile. The lockfile is correct — this npm is not."
            echo
            echo "  Install Node 22 on the server and redeploy:"
            echo "      curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.1/install.sh | bash"
            echo "      . ~/.nvm/nvm.sh && nvm install 22 && nvm alias default 22"
            echo
            echo "  Refusing to install with an npm that cannot read this lockfile."
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::Install dependencies"
          # `npm ci` installs exactly the committed lockfile and fails if
          # package.json and the lockfile disagree — so the lockfile from GitHub
          # is the source of truth, and nothing here rewrites it.
          # --omit=dev leaves jest/nodemon/supertest off the server.
          npm ci --omit=dev
          echo "::endgroup::"

          echo "::group::Restart PM2"
          pm2 restart "$PM2_NAME" --update-env
          pm2 save || true
          echo "::endgroup::"

          echo "::group::Verify process is online"
          # Give it a moment to either come up or crash on boot.
          sleep 5

          STATUS="$(pm2 jlist | PM2_NAME="$PM2_NAME" node -e '
            let raw = "";
            process.stdin.on("data", (c) => (raw += c));
            process.stdin.on("end", () => {
              try {
                const list = JSON.parse(raw.slice(raw.indexOf("[")));
                const proc = list.find((p) => p.name === process.env.PM2_NAME);
                console.log(proc ? proc.pm2_env.status : "missing");
              } catch (e) {
                console.log("unreadable");
              }
            });
          ')"

          echo "pm2 status: $STATUS"
          pm2 status

          if [ "$STATUS" != "online" ]; then
            echo "ERROR: $PM2_NAME is '$STATUS', not online. Deployment failed."
            # Last lines help diagnose a boot crash. Application logs, not env.
            pm2 logs "$PM2_NAME" --lines 30 --nostream || true
            exit 1
          fi

          # Restart counter climbing means it is crash-looping rather than up.
          sleep 5
          STATUS_AGAIN="$(pm2 jlist | PM2_NAME="$PM2_NAME" node -e '
            let raw = "";
            process.stdin.on("data", (c) => (raw += c));
            process.stdin.on("end", () => {
              try {
                const list = JSON.parse(raw.slice(raw.indexOf("[")));
                const proc = list.find((p) => p.name === process.env.PM2_NAME);
                console.log(proc ? proc.pm2_env.status : "missing");
              } catch (e) {
                console.log("unreadable");
              }
            });
          ')"

          if [ "$STATUS_AGAIN" != "online" ]; then
            echo "ERROR: $PM2_NAME did not stay online (now '$STATUS_AGAIN')."
            pm2 logs "$PM2_NAME" --lines 30 --nostream || true
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::Health check"
          # The app's own existing endpoint — see app.js, `app.get("/api", ...)`.
          # Nothing was added to the backend for this.
          PORT="${BACKEND_PORT:-5000}"
          OK=0
          for attempt in 1 2 3 4 5 6; do
            CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
                     "http://127.0.0.1:${PORT}/api" || echo 000)"
            echo "attempt ${attempt}: HTTP ${CODE}"
            if [ "$CODE" = "200" ]; then OK=1; break; fi
            sleep 5
          done

          if [ "$OK" != "1" ]; then
            echo "ERROR: health endpoint did not return 200 on port ${PORT}."
            echo "If the app listens elsewhere, set the repository variable BACKEND_PORT."
            pm2 logs "$PM2_NAME" --lines 30 --nostream || true
            exit 1
          fi
          echo "::endgroup::"

          echo "Deployment successful: $(git -C "$APP_DIR" rev-parse --short HEAD)"
          REMOTE

      - name: Remove deploy key
        # Runs even when the deployment failed, so the key never outlives the job
        # on a runner that is reused before teardown.
        if: always()
        run: rm -f ~/.ssh/deploy_key
