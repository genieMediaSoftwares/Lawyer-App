# Upload size limits for the Genie Law API, per location.
#
# Include this INSIDE the existing `server { ... }` block that serves
# lawyerappvizag.duckdns.org on 443, next to the existing `location /api/`:
#
#     include /etc/nginx/snippets/lawyer-api-uploads.conf;
#
# Every other route keeps the server's current client_max_body_size (nginx
# default 1 MB). Only the locations below accept more.
#
# proxy_pass below MUST be the same target as your existing `location /api/`
# (check with: sudo nginx -T | grep -n proxy_pass). proxy_set_header lines are
# inherited from the server block; if yours live inside `location /api/`, copy
# them into each location here too.

# Oversized requests get the API's JSON 413, which carries the normal CORS
# headers, instead of nginx's HTML page that the browser reports as a CORS error.
error_page 413 /api/errors/payload-too-large;

# Temporary optimization input: one original up to 20 MB (AI_OPTIMIZE_MAX_MB),
# plus multipart overhead. Never stored as-is; shrunk to 3 MB or refused.
location = /api/ai/smart-case/optimize {
    client_max_body_size 21m;
    proxy_request_buffering on;
    # Two Ghostscript passes can take longer than nginx's default 60 s.
    proxy_read_timeout 240s;
    proxy_send_timeout 240s;
    proxy_pass http://127.0.0.1:5000;
}

# Final analysis: up to 10 documents of 3 MB (AI_UPLOAD_MAX_MB) plus a 10 MB
# voice note. Node rejects any single document over 3 MB with 413.
location = /api/ai/smart-case/analyze {
    client_max_body_size 41m;
    proxy_read_timeout 180s;
    proxy_pass http://127.0.0.1:5000;
}

# Voice-note transcription: one recording up to 10 MB.
location = /api/ai/transcribe {
    client_max_body_size 11m;
    proxy_read_timeout 120s;
    proxy_pass http://127.0.0.1:5000;
}

# Case acknowledgement upload/replace: one document up to 3 MB.
location = /api/documents/upload {
    client_max_body_size 4m;
    proxy_pass http://127.0.0.1:5000;
}
location ~ ^/api/documents/[^/]+/replace$ {
    client_max_body_size 4m;
    proxy_pass http://127.0.0.1:5000;
}
